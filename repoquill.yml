project_name: SimpleAudit
package_dir: simpleaudit
source_repo: SushantGautam/simpleaudit
source_ref: main
documentation:
  # The narrative guides are authored by the Pi coding-agent engine
  # (first-class, tool-using documentation author). Deterministic reference
  # pages are still generated from the source AST/Griffe independently.
  engine: pi
llm:
  provider: openai
  model: Qwen/Qwen3.8-27B-FP8
  base_url: https://simulachat.sushant.info.np/api/v1
  api_key_env: OPENAI_API_KEY
  max_concurrent: 4
  include_tests: true
  agentic:
    timeout_s: 900
    context_window: 100000
    compaction_keep_recent_tokens: 60000
    max_file_chars: 40000
    max_repeat_calls: 6
site:
  name: SimpleAudit Documentation
  description: Framework for LLM-based auditing of models, systems and decisions
  url: https://SushantGautam.github.io/simpleaudit-docs/
  repo_url: https://github.com/SushantGautam/simpleaudit
  repo_name: SushantGautam/simpleaudit
narrative_sections:
- title: Getting Started
  slugs:
  - installation
  - quickstart
- title: Core Concepts
  slugs:
  - auditing-basics
  - targets-and-judges
  - scenarios
- title: Advanced Usage
  slugs:
  - context-analysis
  - tracing-and-observability
  - custom-judges

llm:
  provider: openai
  model: Qwen/Qwen3.8-27B-FP8
  base_url: https://simulachat.sushant.info.np/api/v1
  api_key_env: OPENAI_API_KEY

site:
  name: SimpleAudit
  description: "Lightweight, local-first framework for multilingual AI safety auditing and red-teaming via adversarial probing."
  url: https://SushantGautam.github.io/simpleaudit-docs/
  repo_url: https://github.com/SushantGautam/simpleaudit
  repo_name: SushantGautam/simpleaudit

narrative_sections:
  - title: Getting Started
    slugs: [quickstart, installation]
  - title: Core Concepts
    slugs: [architecture, key-ideas]

reference_sections:
  # Add reference sections here (e.g. for Python packages)

index:
  tagline: "A simple, extensible, local-first framework for multilingual auditing and red-teaming of AI systems via adversarial probing. Runs open models locally with no APIs required."
  quick_start:
    install: "pip install -U simpleaudit"
    example: |
      from simpleaudit import ModelAuditor

      auditor = ModelAuditor(
          model="hf.co/NbAiLab/borealis-4b-instruct-preview-gguf:BF16",
          provider="ollama",
          judge_model="gpt-4o",
          judge_provider="openai",
      )
      results = auditor.run("safety", max_turns=5, max_workers=10)
      results.summary()

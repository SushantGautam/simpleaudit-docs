# ============================================================================
# RepoQuill configuration for SimpleAudit
#
# This file drives the RepoQuill docs generator (repoquill generate).
# The simpleaudit source is checked out separately by the docs workflow and
# pointed at via the SOURCE_ROOT env var (see .github/workflows/docs.yml).
# ============================================================================

# --- Project identity ---
# Used in LLM prompts and the index page.
# Full site identity (name, description, URLs) lives under `site:` below.
project_name: SimpleAudit

# --- Package discovery ---
# Name of the top-level Python package to document.
# The generator walks <SOURCE_ROOT>/<package_dir>/ for .py files.
package_dir: simpleaudit

# Root of the source repo. In CI this is set via the SOURCE_ROOT env var
# (the docs workflow checks out the simpleaudit source into the workspace).
# For local runs, set SOURCE_ROOT or uncomment:
# root: /absolute/path/to/simpleaudit

# --- LLM backend (LiteLLM — any provider) ---
# The API key is NEVER stored here. `api_key_env` names the environment
# variable that holds the key (set it in your shell or GitHub Actions secrets).
llm:
  provider: openai            # openai | anthropic | openrouter | groq | ollama | ...
  model: default              # model id on the custom endpoint (Qwen3.8-27B-FP8)
  api_key_env: OPENAI_API_KEY # env var name holding the API key
  base_url: https://simulachat.sushant.info.np/api/v1  # custom OpenAI-compatible endpoint
  temperature: 0.3
  max_tokens: 8192
  # Optional local RAG (runs offline on the GitHub runner, no API key).
  # rag:
  #   enabled: false
  #   model: all-MiniLM-L6-v2
  #   top_k: 6
  #   chunk_size: 1500

# --- Index page (deterministic, no LLM) ---
index:
  tagline: >
    Lightweight AI safety auditing: LLM judges score model outputs for
    safety, harm, factuality, and helpfulness across curated scenario packs.
    Results are aggregated, compared across models and judges, and
    visualized in the browser.
  quick_start:
    install: "pip install simpleaudit"
    example: |
      from simpleaudit import ModelAuditor, get_scenarios

      auditor = ModelAuditor(
          model="gpt-4o-mini",
          provider="openai",
          judge_model="gpt-4o",
          judge_provider="openai",
      )
      results = auditor.run(get_scenarios("safety"))
      results.summary()
    cli: |
      # Browse results in the browser
      simpleaudit serve --results_dir ./results

# --- Narrative guide sections (Layer 2, LLM-generated) ---
# Each entry: section title -> list of page slugs.
# Slugs must match the .md filenames in site_src/guides/.
narrative_sections:
  - title: Start Here
    slugs: [getting-started, core-architecture, cli-usage]
  - title: Judges
    slugs: [judges, judge-validation, cross-judge-validation]
  - title: Scenarios
    slugs: [scenarios]
  - title: Results & Tooling
    slugs: [results-analysis, visualization]
  - title: Advanced
    slugs: [reframing-advanced-workflows]

# --- API reference nav sections (Layer 1, Griffe-generated) ---
# Each entry: section title -> list of module prefixes.
# A module belongs to a section if it equals or starts with a prefix + ".".
reference_sections:
  - title: Core
    modules:
      - simpleaudit
      - simpleaudit.model_auditor
      - simpleaudit.results
      - simpleaudit.experiment
      - simpleaudit.repeated_results
      - simpleaudit.cross_judge
      - simpleaudit.reframing
      - simpleaudit.judge_the_judge
      - simpleaudit.cli
      - simpleaudit.utils
  - title: Judges
    modules:
      - simpleaudit.judges
  - title: Scenarios
    modules:
      - simpleaudit.scenarios
  - title: Visualization
    modules:
      - simpleaudit.visualization


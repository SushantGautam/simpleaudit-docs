name: Docs

on:
  # Auto-run disabled. To enable, uncomment one of:
  #   push:
  #     branches: [main]
  #   push:            # all branches
  #   push:
  #     tags: ['v*']   # on release
  workflow_dispatch:

jobs:
  generate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout RepoQuill
        uses: actions/checkout@v4
        with:
          repository: SushantGautam/RepoQuill
          ref: main
          path: _repoquill

      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          repository: kelkalot/simpleaudit
          ref: main
          path: source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install RepoQuill
        run: |
          python -m pip install --upgrade pip
          pip install ./_repoquill

      - name: Generate docs
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          SOURCE_ROOT: ${{ github.workspace }}/source
        run: |
          export OPENAI_API_KEY="${LLM_API_KEY}"
          repoquill generate --config repoquill.yml --build

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site

  deploy:
    needs: generate-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages

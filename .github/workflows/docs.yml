# ============================================================================
# SimpleAudit docs — powered by RepoQuill
#
# This is a docs-only repo. The simpleaudit source is checked out separately
# (via the reusable workflow's source_repo input) and pointed at via
# SOURCE_ROOT. The LLM API key is read from the LLM_API_KEY secret and
# exposed to the LLM client as the env var named in repoquill.yml
# (api_key_env).
# ============================================================================
name: Docs

on:
  push:
    branches: [main]
  # Regenerate docs when the config or workflow changes.
  pull_request:
    branches: [main]
    paths:
      - "repoquill.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

jobs:
  docs:
    # Run the full reusable workflow (generate + build + deploy) on push to
    # main and manual dispatch. On PRs, just generate (no deploy) as a check.
    if: github.event_name != 'pull_request'
    uses: SushantGautam/RepoQuill/.github/workflows/reusable.yml@main
    with:
      config: repoquill.yml
      # Check out the simpleaudit source separately (docs-only repo).
      source_repo: SushantGautam/simpleaudit
      source_ref: main
      api_key_secret: LLM_API_KEY     # name of the secret in THIS repo
      api_key_env: OPENAI_API_KEY      # must match api_key_env in repoquill.yml
      deploy_branch: gh-pages
      deploy_path: site
    secrets: inherit

  # Lightweight PR check: build the deterministic reference only (no LLM,
  # no API key) to catch config/reference regressions on every PR.
  docs-check:
    if: github.event_name == 'pull_request'
    uses: SushantGautam/RepoQuill/.github/workflows/reusable.yml@main
    with:
      config: repoquill.yml
      source_repo: SushantGautam/simpleaudit
      source_ref: main
      no_llm: "true"
      deploy_branch: ""

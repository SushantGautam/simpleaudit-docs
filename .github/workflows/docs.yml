name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      clean:
        description: "Delete docs/ before generating (forces full regeneration)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# Required: the reusable workflow commits docs back to this repo, and
# cross-repo workflow calls default to contents:read without this.
permissions:
  contents: write

jobs:
  docs:
    # The Pi narrative engine (documentation.engine: pi in repoquill.yml)
    # currently lives on RepoQuill's `dev` branch; the reusable workflow is
    # also referenced from `dev` so it can provision Node + the pinned Pi
    # runtime and run the Pi-capable generator. Once the Pi engine is merged
    # to `main`, switch both refs back to `main` (and drop repoquill_ref).
    uses: SushantGautam/RepoQuill/.github/workflows/reusable.yml@dev
    with:
      config: repoquill.yml
      repoquill_ref: dev
      api_key_secret: LLM_API_KEY
      api_key_env: OPENAI_API_KEY
      deploy_branch: gh-pages
      deploy_path: site_repoquill
      clean: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.clean || 'false' }}
    secrets:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

# ============================================================================
# SimpleAudit docs — powered by RepoQuill
#
# This is a docs-only repo. The simpleaudit source is checked out separately
# and pointed at via SOURCE_ROOT. The LLM API key is read from the
# LLM_API_KEY secret and exposed to the LLM client as the env var named in
# repoquill.config.yml (api_key_env).
#
# RepoQuill is installed from the SushantGautam/RepoQuill repo (not PyPI).
# ============================================================================
name: RepoQuill

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/repoquill.config.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
    inputs:
      deploy_target:
        description: >
          Where to publish the built site.
          "gh-pages" publishes to a dedicated gh-pages branch (default).
          "branch-folder" commits the built site into docs/ on the default
          branch (main). "branch-folder:<branch>" commits into docs/ on a
          specific branch. "branch-folder:<branch>:<folder>" commits into a
          custom folder (e.g. "branch-folder:dev:guides"). GitHub Pages must
          be configured to serve from the matching branch and folder path.
        required: false
        default: "gh-pages"
        type: string

jobs:
  generate-and-build:
    # Skip when the push is the docs-bot's own "rebuild site" commit (avoids
    # an infinite loop when DEPLOY_TARGET=branch-folder commits back to main).
    if: >
      github.event_name != 'pull_request' &&
      !(github.event_name == 'push' &&
        contains(github.event.head_commit.message, '[skip ci]'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs repo
        uses: actions/checkout@v4

      - name: Checkout RepoQuill
        uses: actions/checkout@v4
        with:
          repository: SushantGautam/RepoQuill
          path: _repoquill

      - name: Checkout simpleaudit source
        uses: actions/checkout@v4
        with:
          repository: SushantGautam/simpleaudit
          ref: main
          path: source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install RepoQuill
        run: |
          python -m pip install --upgrade pip
          pip install ./_repoquill

      - name: Generate + build docs
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.LLM_API_KEY }}
          SOURCE_ROOT: ${{ github.workspace }}/source
        run: |
          repoquill generate \
            --config .github/workflows/repoquill.config.yml \
            --build

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/

  deploy:
    if: github.event_name != 'pull_request'
    needs: generate-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Where to publish. Override via the workflow_dispatch input, or set a
      # repository variable / secret named DEPLOY_TARGET to change the default.
      # Format: "gh-pages" | "branch-folder" | "branch-folder:<branch>"
      DEPLOY_TARGET: "${{ github.event.inputs.deploy_target || vars.DEPLOY_TARGET || 'gh-pages' }}"
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site/

      - name: Show deploy target
        run: |
          echo "Deploy target: $DEPLOY_TARGET"
          if [[ "$DEPLOY_TARGET" == branch-folder* ]]; then
            REST="${DEPLOY_TARGET#branch-folder:}"
            BRANCH="${REST%%:*}"
            FOLDER="docs"
            if [[ "$REST" == *:* ]]; then
              FOLDER="${REST#*:}"
            fi
            [ -z "$BRANCH" ] && BRANCH="<default branch>"
            echo "Deploy branch: $BRANCH"
            echo "Deploy folder: $FOLDER/"
          fi

      # ------------------------------------------------------------------
      # Option A: publish to a dedicated gh-pages branch (default).
      # GitHub Pages must be configured to serve from the gh-pages branch.
      # ------------------------------------------------------------------
      - name: Deploy to gh-pages branch
        if: "env.DEPLOY_TARGET == 'gh-pages'"
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages

      # ------------------------------------------------------------------
      # Option B: commit the built site into docs/ on the default branch.
      # GitHub Pages must be configured to serve from the /docs folder on
      # the default branch (main). No extra branch is created.
      # ------------------------------------------------------------------
      - name: Resolve deploy branch and folder
        if: startsWith(env.DEPLOY_TARGET, 'branch-folder')
        id: resolve-branch
        run: |
          # Format: branch-folder[:<branch>[:<folder>]]
          #   branch-folder              -> default branch, docs/
          #   branch-folder:dev          -> dev branch, docs/
          #   branch-folder:dev:guides   -> dev branch, guides/
          #   branch-folder::guides      -> default branch, guides/
          REST="${DEPLOY_TARGET#branch-folder:}"
          # Split on first colon: branch:folder
          BRANCH="${REST%%:*}"
          FOLDER="docs"
          if [[ "$REST" == *:* ]]; then
            FOLDER="${REST#*:}"
          fi
          # Empty branch means default branch
          if [ -z "$BRANCH" ]; then
            BRANCH="${{ github.event.repository.default_branch }}"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "folder=$FOLDER" >> "$GITHUB_OUTPUT"

      - name: Checkout target branch
        if: startsWith(env.DEPLOY_TARGET, 'branch-folder')
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve-branch.outputs.branch }}
          path: repo

      - name: Commit site into target folder
        if: startsWith(env.DEPLOY_TARGET, 'branch-folder')
        env:
          TARGET_FOLDER: ${{ steps.resolve-branch.outputs.folder }}
        run: |
          set -euo pipefail
          FOLDER="$TARGET_FOLDER"
          # Replace the target folder with the freshly built site.
          rm -rf "repo/$FOLDER"
          mkdir -p "repo/$FOLDER"
          cp -R site/* "repo/$FOLDER/"
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A "$FOLDER/"
          if git diff --cached --quiet; then
            echo "No changes to $FOLDER/ — skipping commit."
          else
            git commit -m "docs: rebuild site in $FOLDER/ (RepoQuill) [skip ci]"
            git push
          fi

  # Lightweight PR check: build the deterministic reference only (no LLM,
  # no API key) to catch config/reference regressions on every PR.
  docs-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs repo
        uses: actions/checkout@v4

      - name: Checkout RepoQuill
        uses: actions/checkout@v4
        with:
          repository: SushantGautam/RepoQuill
          path: _repoquill

      - name: Checkout simpleaudit source
        uses: actions/checkout@v4
        with:
          repository: SushantGautam/simpleaudit
          ref: main
          path: source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install RepoQuill
        run: |
          python -m pip install --upgrade pip
          pip install ./_repoquill

      - name: Generate reference (no LLM)
        env:
          SOURCE_ROOT: ${{ github.workspace }}/source
        run: |
          repoquill generate \
            --config .github/workflows/repoquill.config.yml \
            --no-llm \
            --build
